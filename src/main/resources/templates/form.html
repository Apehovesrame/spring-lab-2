<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма военнослужащего</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <h1 th:text="${serviceman.id == null ? 'Добавление военнослужащего' : 'Редактирование военнослужащего'}"></h1>

    <form action="#" th:action="@{/servicemen/save}" th:object="${serviceman}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Фамилия:</label>
            <input type="text" th:field="*{surname}" required />
        </div>

        <div class="form-group">
            <label>Имя:</label>
            <input type="text" th:field="*{name}" required />
        </div>

        <div class="form-group">
            <label>Отчество:</label>
            <input type="text" th:field="*{patronymic}" />
        </div>

        <div class="form-group">
            <label>Национальность:</label>
            <input type="text" th:field="*{nationality}" />
        </div>

        <div class="form-group">
            <label>Дата рождения:</label>
            <input type="date" th:field="*{birthDate}" required />
        </div>

        <div class="form-group">
            <label>Должность:</label>
            <input type="text" th:field="*{position}" required />
        </div>

        <div class="form-group">
            <label>Звание:</label>
            <input type="text" th:field="*{rank}" required />
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <input type="submit" class="btn btn-primary" value="Сохранить" />
            <a th:href="@{/servicemen}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
